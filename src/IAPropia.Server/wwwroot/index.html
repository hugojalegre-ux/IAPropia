<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siltex</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var key = "ia-propia-theme";
      var mode = localStorage.getItem(key) || "system";
      var dark =
        mode === "dark" ||
        (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme-mode", mode);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="brand-icon" viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <defs>
              <linearGradient id="siltex-mark-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="var(--brand-gradient-a)"/>
                <stop offset="100%" stop-color="var(--brand-gradient-b)"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="8" fill="url(#siltex-mark-bg)"/>
            <rect x="6" y="7" width="20" height="2.8" rx="1.4" fill="currentColor" opacity="0.95"/>
            <rect x="6" y="12.2" width="20" height="2.8" rx="1.4" fill="currentColor" opacity="0.72"/>
            <rect x="6" y="17.4" width="20" height="2.8" rx="1.4" fill="currentColor" opacity="0.52"/>
            <rect x="6" y="22.6" width="13" height="2.8" rx="1.4" fill="currentColor" opacity="0.36"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="brand-title">Siltex</h1>
          <p class="tagline" id="brand-tagline">Capas de charlas y notas, en tu PC</p>
        </div>
        <div class="theme-switch" role="group" aria-label="Tema de la interfaz">
          <button type="button" class="theme-btn" data-theme="light" id="theme-light" title="Tema claro">☀</button>
          <button type="button" class="theme-btn" data-theme="dark" id="theme-dark" title="Tema oscuro">☾</button>
          <button type="button" class="theme-btn" data-theme="system" id="theme-system" title="Igual que Windows">Auto</button>
        </div>
      </header>

      <button type="button" id="btn-nueva" class="btn primary block">+ Nueva charla</button>

      <div class="card card-compact">
        <label class="field-label" for="carpeta">Carpeta del proyecto</label>
        <select id="carpeta" title="Agrupá tus charlas por tema"></select>
        <button type="button" id="btn-nueva-carpeta" class="btn link">Crear otra carpeta</button>
      </div>

      <details class="card card-fold">
        <summary>Ajustes del modelo</summary>
        <div class="card-body">
          <label class="field-label" for="persona">Persona</label>
          <select id="persona"></select>
          <label class="field-label" for="modelo-select">Modelo Ollama</label>
          <select id="modelo-select"></select>
          <details class="modelo-avanzado">
            <summary>Otro modelo (escribir)</summary>
            <input id="modelo-custom" type="text" placeholder="ej. llama3.2" />
          </details>
          <div class="checks-group">
            <label class="field-label" for="api-key-local">Clave API (si el servidor la exige)</label>
            <input id="api-key-local" type="password" autocomplete="off" placeholder="X-IAPropia-Key desde secrets" />
            <button type="button" id="btn-guardar-api-key" class="btn link">Guardar clave en este navegador</button>
            <label class="check" title="Archivos en conocimiento/ pueden contener texto manipulado; el modelo no debe obedecer instrucciones ocultas">
              <input type="checkbox" id="usar-rag" checked />
              <span>Usar mis notas locales</span>
            </label>
            <label class="check" title="DuckDuckGo (JSON + HTML). No es Google; puede fallar o ser irrelevante — el modelo debe avisar si no hay datos.">
              <input type="checkbox" id="usar-internet" />
              <span>Buscar en internet antes de responder</span>
            </label>
            <label class="check" title="Hasta ~20 min y más contexto Ollama (num_ctx / num_predict)">
              <input type="checkbox" id="modo-pesado" />
              <span>Respuestas largas / modelo pesado</span>
            </label>
            <label class="check check-muted">
              <input type="checkbox" id="forzar-envio" />
              <span>Enviar aunque Ollama no esté listo</span>
            </label>
          </div>
        </div>
      </details>

      <div class="sidebar-tabs" role="tablist">
        <button type="button" class="sidebar-tab active" data-tab="historial" role="tab">Charlas</button>
        <button type="button" class="sidebar-tab" data-tab="aprendizajes" role="tab">
          Aprendizajes <span id="aprendizajes-count" class="badge"></span>
        </button>
      </div>

      <section id="pane-historial" class="pane scroll-pane" role="tabpanel">
        <ul id="lista-conversaciones" class="conv-list"></ul>
      </section>
      <section id="pane-aprendizajes" class="pane scroll-pane hidden" role="tabpanel">
        <ul id="lista-aprendizajes" class="apr-list"></ul>
      </section>

      <footer class="estado estado-pill" id="estado-servicio" title="Estado de Ollama"></footer>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

    <main class="chat">
      <header class="chat-toolbar">
        <button
          type="button"
          id="btn-sidebar"
          class="btn icon-btn sidebar-toggle"
          aria-label="Abrir panel de charlas"
          title="Charlas y carpetas"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <input
          id="titulo-chat"
          class="titulo-input"
          type="text"
          placeholder="Nombre de esta charla (opcional)"
          aria-label="Título de la charla"
        />
        <details class="organizar-panel" id="panel-organizar">
          <summary class="btn ghost">Organizar charla</summary>
          <div class="organizar-body card">
            <p class="intro">Enlazá otras charlas para reutilizar ideas y aprendizajes guardados.</p>
            <div class="enlaces-head">
              <label class="check check-inline">
                <input type="checkbox" id="enlace-todas-carpetas" />
                <span>Mostrar charlas de todas las carpetas</span>
              </label>
            </div>
            <div id="lista-enlaces" class="enlace-list" aria-label="Charlas para enlazar"></div>
            <details class="ids-avanzado">
              <summary>IDs manual</summary>
              <input id="relacionadas" type="text" placeholder="solo si necesitás pegar un id" />
            </details>
            <div class="chat-actions">
              <button type="button" id="btn-guardar-meta" class="btn secondary">Guardar cambios</button>
              <button type="button" id="btn-aprendizaje" class="btn secondary">Guardar aprendizaje</button>
            </div>
          </div>
        </details>
      </header>

      <div id="mensajes" class="mensajes" role="log" aria-live="polite"></div>

      <form id="form-chat" class="composer">
        <div class="composer-wrap">
          <div class="modo-row">
            <label class="field-label modo-select-label" for="modo-select">Modo</label>
            <select id="modo-select" class="modo-select" aria-label="Modo de interacción">
              <option value="ask">Preguntar</option>
              <option value="plan">Plan</option>
              <option value="multiplan">Multi-plan</option>
              <option value="agent">Agente</option>
              <option value="debug">Debug</option>
            </select>
            <div class="modo-bar" role="tablist" aria-label="Modo (estilo Cursor)">
              <button type="button" class="modo-btn active" data-modo="ask" role="tab" aria-selected="true" title="Respuesta directa, sin plan largo">Preguntar</button>
              <button type="button" class="modo-btn" data-modo="plan" role="tab" aria-selected="false" title="Plan paso a paso antes de actuar">Plan</button>
              <button type="button" class="modo-btn" data-modo="multiplan" role="tab" aria-selected="false" title="Opciones A / B / C con trade-offs">Multi-plan</button>
              <button type="button" class="modo-btn" data-modo="agent" role="tab" aria-selected="false" title="Guía proactiva con siguientes pasos">Agente</button>
              <button type="button" class="modo-btn modo-btn-debug" data-modo="debug" role="tab" aria-selected="false" title="Razonamiento visible + métricas del servidor">Debug</button>
            </div>
          </div>
          <div class="composer-inner">
            <textarea
              id="input"
              rows="2"
              placeholder="Escribí lo que quieras preguntar o contar…"
              required
              aria-label="Mensaje"
            ></textarea>
            <button type="submit" class="btn primary btn-send" id="btn-enviar">Enviar</button>
          </div>
        </div>
      </form>
    </main>
  </div>
  <script src="markdown-lite.js"></script>
  <script src="app.js"></script>
</body>
</html>
